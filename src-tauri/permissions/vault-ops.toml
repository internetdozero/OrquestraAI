# Vault key lifecycle the UI actually drives: writes, primary selection,
# live connection pings, key removal and secret reveal. Granted to the main
# window by `capabilities/vault-ops.json`; without that file every one of
# these invokes fails closed with a permission error. Blind key use
# (`vault_exec`, `vault_http_request`) is NOT here: it lives in the withheld
# `vault-blind-ops` set, granted to no window until a confirmed caller exists.
[[set]]
identifier = "vault-ops"
description = "Vault key lifecycle (no blind key use)."
permissions = [
  "allow-vault-save-service",
  "allow-vault-delete-service",
  "allow-vault-set-service-enabled",
  "allow-vault-set-primary",
  "allow-vault-test-connection",
  "allow-vault-remove-key",
  "allow-vault-purge-migration-backups",
  "allow-reveal-mcp-secret",
]
