<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- OwnHub Symbol Master: Tier 1 Bold Flat (White) -->
  <g id="ownhub-symbol-flat-white" transform="translate(256, 258)">
    <!-- Faceta Superior 2D -->
    <polygon points="0,-175 151,-88 95,-55 0,-110 -95,-55 -151,-88" fill="#FFFFFF"/>
    
    <!-- Faceta Direita -->
    <polygon points="151,-88 151,88 95,55 95,-55" fill="#FFFFFF" opacity="0.85"/>
    <polygon points="151,88 0,175 0,110 95,55" fill="#FFFFFF" opacity="0.85"/>

    <!-- Faceta Esquerda -->
    <polygon points="-151,-88 -95,-55 -95,55 -151,88" fill="#FFFFFF" opacity="0.6"/>
    <polygon points="-151,88 0,175 0,110 -95,55" fill="#FFFFFF" opacity="0.6"/>

    <!-- Gaps Divisórios de Alta Precisão (8px) -->
    <line x1="0" y1="-175" x2="0" y2="-110" stroke="#0B0C0E" stroke-width="8" stroke-linecap="round"/>
    <line x1="151" y1="88" x2="95" y2="55" stroke="#0B0C0E" stroke-width="8" stroke-linecap="round"/>
    <line x1="-151" y1="88" x2="-95" y2="55" stroke="#0B0C0E" stroke-width="8" stroke-linecap="round"/>

    <!-- Câmara Central Hexagonal -->
    <polygon points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27" fill="#0B0C0E" stroke="#FFFFFF" stroke-width="6"/>

    <!-- 6 Eixos de Conexão Axiais -->
    <line x1="0" y1="-54" x2="0" y2="-110" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="47" y1="-27" x2="95" y2="-55" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="47" y1="27" x2="95" y2="55" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="0" y1="54" x2="0" y2="110" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="-47" y1="27" x2="-95" y2="55" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="-47" y1="-27" x2="-95" y2="-55" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Kernel Central Sólido -->
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
  </g>
</svg>
