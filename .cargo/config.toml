# Portable Cargo build configuration — safe to commit.
# Must work on a clean clone with stock Rust (no sccache/mold/clang required).
#
# Machine-specific speedups (sccache, clang, mold) live in the OPTIONAL
# `.cargo/config.local.toml` next door (gitignored). Cargo merges it on top
# of this file when present. Copy the example to opt in:
#   cp .cargo/config.local.toml.example .cargo/config.local.toml

include = [
    { path = "config.local.toml", optional = true },
]

[build]
# 2 cores / 4 threads: limiting to 2 parallel jobs preserves thermal headroom (<80 °C)
# and prevents aggressive thermal throttling on dual-core hardware.
jobs = 2
