# Single source of truth for Cargo build configuration.
# `src-tauri/.cargo/config.toml` used to repeat these flags; Cargo merges all
# ancestor config files, so the duplicate caused the wrapper/linker/rustflags
# to be applied twice depending on the directory the command ran from.

[build]
rustc-wrapper = "/usr/bin/sccache"
# 2 cores / 4 threads: leaving one thread free keeps the desktop responsive
# instead of swapping while every LLVM codegen unit runs at once.
jobs = 3

[target.x86_64-unknown-linux-gnu]
linker = "/usr/bin/clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
