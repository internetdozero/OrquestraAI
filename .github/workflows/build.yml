name: Remote Build & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish as a GitHub Release?"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: orquestra-linux-x86_64
            bin_name: orquestra-linux-x86_64
            is_linux: true
            is_macos: false
            # The legacy `orquestra-ai` alias is publishable once; only the
            # x86_64 row claims it so the arm64 row cannot collide.
            legacy_alias: true
          # Native arm64 runner: no cross-compilation, so WebKitGTK and
          # rusqlite's bundled SQLite build for the target architecture.
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            artifact: orquestra-linux-aarch64
            bin_name: orquestra-linux-aarch64
            is_linux: true
            is_macos: false
            legacy_alias: false
          - name: macOS Apple Silicon (arm64)
            # macos-14 retired 2026-11-02; arm64 builds stay on macos-15.
            os: macos-15
            artifact: orquestra-macos-arm64
            bin_name: orquestra-macos-arm64
            is_linux: false
            is_macos: true
            # Name the bundle zip the installer looks for.
            bundle_arch: arm64
            legacy_alias: false
          # Intel macs: `macos-13` was retired in Dec 2025, so native
          # x86_64 builds ride `macos-15-intel` (last Intel label, kept
          # until Aug 2027). Asset naming mirrors the arm64 row.
          - name: macOS Intel (x86_64)
            os: macos-15-intel
            artifact: orquestra-macos-x86_64
            bin_name: orquestra-macos-x86_64
            is_linux: false
            is_macos: true
            bundle_arch: x86_64
            legacy_alias: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies (WebKitGTK & Tauri prerequisites)
        if: matrix.platform.is_linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            clang \
            mold

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build OrquestraAI Release Binary & SHA-256 Checksum
        env:
          # Signing is opt-in: `tauri build` signs the bundle and the dmg only
          # when these are present, and notarization follows from APPLE_ID,
          # APPLE_PASSWORD and APPLE_TEAM_ID. A fork without the secrets still
          # produces a working (unsigned) artifact.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ matrix.platform.is_macos }}" = "true" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            # One build produces both shapes: the bundle (what macOS users
            # open) and the Mach-O inside it (what the updater replaces).
            npx tauri build --bundles app,dmg
          else
            npx tauri build --no-bundle
          fi
          mkdir -p bin-out
          cp target/release/orquestra-ai bin-out/${{ matrix.platform.bin_name }}
          if [ "${{ matrix.platform.legacy_alias }}" = "true" ]; then
            cp target/release/orquestra-ai bin-out/orquestra-ai
          fi
          if [ "${{ matrix.platform.is_macos }}" = "true" ]; then
            APP="target/release/bundle/macos/OrquestraAI.app"
            if [ -d "$APP" ]; then
              # Notarization is asynchronous proof: staple the ticket to the
              # bundle so it validates offline, then ship it as a zip (dmg is
              # published too, for drag-and-drop installs).
              if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
                xcrun stapler staple "$APP" || echo "::warning::stapler found no ticket; the bundle is unsigned or notarization was skipped"
              fi
              ditto -c -k --keepParent "$APP" "bin-out/OrquestraAI-${{ matrix.platform.bundle_arch }}.app.zip"
              cp target/release/bundle/dmg/*.dmg bin-out/ 2>/dev/null || true
            else
              echo "::warning::no app bundle was produced; only the bare binary is published"
            fi
          fi
          chmod +x bin-out/*.app.zip 2>/dev/null || true
          chmod +x bin-out/*
          cd bin-out
          # The bundle is a zip: `chmod +x` must not have touched it, but the
          # checksum covers every published byte either way.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
          else
            shasum -a 256 * > SHA256SUMS.txt
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.artifact }}
          path: bin-out/*
          retention-days: 14

  linux-compat:
    # The release is built on Ubuntu 22.04, so its symbols reference glibc
    # 2.35 and the binary stops at the loader on anything older. `ldd` cannot
    # see this: it lists libraries, not symbol versions. This job runs the
    # published artifact's own requirement check inside the distributions the
    # old release was reported broken on, so the limitation is measured rather
    # than assumed.
    #
    # Deliberately not a `needs` of the release job: a compatibility failure
    # must be visible, not silently block an otherwise valid release.
    name: Linux compatibility (glibc)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:11
          - rockylinux:8
    container: ${{ matrix.image }}
    steps:
      - name: Checkout repository (compatibility script)
        uses: actions/checkout@v7

      - name: Install the inspection tools
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends binutils bash
          else
            dnf install -y binutils bash
          fi

      - name: Download the Linux x86_64 artifact
        uses: actions/download-artifact@v8
        with:
          name: orquestra-linux-x86_64
          path: artifact

      - name: Check the binary against this distribution's glibc
        run: |
          chmod +x artifact/orquestra-linux-x86_64
          ./scripts/check-glibc.sh artifact/orquestra-linux-x86_64

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository (signing script)
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare Unified Release Directory & Checksums
        run: |
          mkdir -p release-assets
          find artifacts -type f ! -name "SHA256SUMS.txt" -exec cp {} release-assets/ \;
          cd release-assets
          chmod +x *
          sha256sum * > SHA256SUMS.txt
          echo "=== Unified SHA256 Checksums ==="
          cat SHA256SUMS.txt

      # Supply-chain signature over the checksums. Fail closed when the
      # UPDATE_SIGNING_SEED secret is missing: the updater refuses releases
      # without SHA256SUMS.txt.minisig, so publishing unsigned is worse
      # than publishing nothing. Setup: maintainer pastes the offline
      # update-signing-seed.hex content (`seedhex:keynumhex`) as a repo or
      # environment secret named UPDATE_SIGNING_SEED.
      - name: Sign SHA256SUMS.txt (Ed25519 detached signature)
        env:
          UPDATE_SIGNING_SEED: ${{ secrets.UPDATE_SIGNING_SEED }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$UPDATE_SIGNING_SEED" ]; then
            echo "::error::UPDATE_SIGNING_SEED secret is not configured; refusing to publish an unsigned release"
            exit 1
          fi
          pip install --quiet pynacl
          python3 scripts/sign-release.py release-assets/SHA256SUMS.txt --tag "$RELEASE_TAG"
          echo "=== Signature trusted comment ==="
          grep "^trusted comment:" release-assets/SHA256SUMS.txt.minisig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          make_latest: true
