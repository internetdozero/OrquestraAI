name: Remote Build & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release?'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: orquestra-linux-x86_64
            bin_name: orquestra-linux-x86_64
            is_linux: true
          - name: macOS Apple Silicon (arm64)
            os: macos-14
            artifact: orquestra-macos-arm64
            bin_name: orquestra-macos-arm64
            is_linux: false
          - name: macOS Intel (x86_64)
            os: macos-13
            artifact: orquestra-macos-x86_64
            bin_name: orquestra-macos-x86_64
            is_linux: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (WebKitGTK & Tauri prerequisites)
        if: matrix.platform.is_linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            clang \
            mold

      - name: Configure runner cargo environment
        run: |
          # Remove local .cargo/config.toml that forces local paths
          rm -f .cargo/config.toml

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build OrquestraAI Release Binary & SHA-256 Checksum
        run: |
          npx tauri build --no-bundle
          mkdir -p bin-out
          if [ "${{ matrix.platform.is_linux }}" = "true" ]; then
            cp target/release/orquestra-ai bin-out/orquestra-linux-x86_64
            cp target/release/orquestra-ai bin-out/orquestra-ai
            chmod +x bin-out/orquestra-linux-x86_64 bin-out/orquestra-ai
          else
            cp target/release/orquestra-ai bin-out/${{ matrix.platform.bin_name }}
            chmod +x bin-out/${{ matrix.platform.bin_name }}
          fi
          cd bin-out
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
          else
            shasum -a 256 * > SHA256SUMS.txt
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.artifact }}
          path: bin-out/*
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
    runs-on: ubuntu-22.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Unified Release Directory & Checksums
        run: |
          mkdir -p release-assets
          find artifacts -type f ! -name "SHA256SUMS.txt" -exec cp {} release-assets/ \;
          cd release-assets
          chmod +x *
          sha256sum * > SHA256SUMS.txt
          echo "=== Unified SHA256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
