name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    # Rust test job: runs the Tauri/Rust workspace tests and Clippy.
    name: Rust tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # Check out the repository.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Set up Node.js (needed for npm ci; debug cargo test does not embed UI).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Install frontend dependencies so Tauri build scripts resolve.
      - name: Install Node dependencies
        run: npm ci

      # Install WebKitGTK and Tauri system prerequisites (mirrors build.yml).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            clang \
            mold

      # Install the stable Rust toolchain.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache Rust build artifacts for faster reruns.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Rust formatting gate: rustfmt violations fail the pipeline before
      # tests run. Keep the tree `cargo fmt --all` clean; the gate is the
      # enforcer, not the fixer.
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # Run the full Rust workspace test suite.
      - name: Run cargo tests
        run: cargo test --workspace

      # Deny all Clippy warnings across the workspace.
      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

  windows-cross-check:
    # `ownhub` cannot be cross-built for Windows from a Linux runner:
    # `ring`'s build script and `rusqlite`'s bundled SQLite need a Windows C
    # toolchain, and both stop the build before this repository's code is
    # parsed. Its `#[cfg(windows)]` modules therefore compile through the
    # staging crate in `tools/windows-typecheck` (real files, `#[path]`-
    # included), while the portable crates are cross-compiled for real.
    name: Windows cross-check
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/windows-typecheck

      # No `npm ci`: nothing here builds the frontend or the Tauri shell.
      - name: Cross-check Windows code
        run: ./scripts/windows-typecheck.sh

  windows-check:
    # The desktop shell still contains Unix-only code; the libraries below are
    # portable and must stay that way. `ownhub-bridge` joined the list with
    # the junction projection model (docs/decisions/windows-projections.md).
    # The portable crates whose test targets build here also run their suites on
    # this runner, so Windows behavior is executed instead of only compiled.
    name: Windows check
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # Check out the repository.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Tauri's build script resolves the frontend, as in the Linux job.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # MSVC is the toolchain the eventual Windows release will use, and
      # rusqlite's bundled SQLite needs a C compiler: windows-latest ships both.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `install.ps1` cannot be executed on the Linux runner at all: parsing it
      # here is the only place its signature/checksum logic is ever run. The
      # script dot-sources itself with `-TestOnly`, so nothing is downloaded.
      - name: Test the PowerShell installer offline
        shell: pwsh
        run: ./scripts/Test-Install.ps1

      # `--all-targets` so the test modules of these crates compile here too,
      # not just the libraries the Linux runner already checks.
      - name: Cargo check (portable crates, test targets included)
        run: cargo check --all-targets -p ownhub-core -p ownhub-harness -p ownhub-bridge

      # Real Windows execution, not a compile-only check. Only these three
      # crates are listed: their test targets build for Windows (each unix-only
      # fixture is behind `#[cfg(unix)]`). `ownhub-sessions` and
      # `ownhub-vault` still fail to compile their tests for Windows — the
      # session fixtures rely on `std::os::unix` — so they stay compile-only
      # below until that is fixed.
      - name: Run cargo tests (portable crates)
        run: cargo test --all-targets -p ownhub-core -p ownhub-harness -p ownhub-bridge

      # Library-only: these two keep their compile coverage on Windows while
      # their test targets remain unix-only.
      - name: Cargo check (sessions and vault)
        run: cargo check -p ownhub-vault -p ownhub-sessions

      # The desktop shell itself. This is the gate that decides whether the
      # Windows release row can build at all, so it is checked on every push
      # rather than discovered when a tag is pushed. Library and binary only:
      # the shell's test modules still create symlinks through
      # `std::os::unix`, which is a separate porting job.
      - name: Cargo check (desktop shell)
        run: cargo check -p ownhub

  macos-check:
    # The Darwin half of the janitor health collector only exists behind
    # `#[cfg(target_os = "macos")]`, so nothing on the Linux runner ever runs
    # it: `src-tauri/src/janitor/health/macos/native.rs` (sysctl,
    # `host_statistics64`, libproc) could break without a single job noticing.
    # This job runs the workspace suite on Darwin so that code is exercised,
    # not just compiled, on every pull request.
    name: macOS check
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      # Check out the repository.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Tauri's build script resolves the frontend, as in the Linux job.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # The runner ships aarch64 Apple Clang and the macOS SDK, so rusqlite's
      # bundled SQLite compiles without extra packages.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tests, not a compile-only check: the whole workspace is Unix, so the
      # Darwin-gated modules (`janitor/health/macos`, the updater's bundle
      # handling, the tray) are executed here instead of merely parsed.
      - name: Run workspace tests
        run: cargo test --workspace

  node-tests:
    # Node test job: runs frontend unit tests and the TS typecheck.
    name: Node tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # Check out the repository.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Set up Node.js with npm caching.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Install frontend dependencies.
      - name: Install Node dependencies
        run: npm ci

      # package.json, tauri.conf.json and Cargo.toml must agree; the bump
      # script owns all three, this gate catches manual edits that bypass it.
      - name: Check version sync
        run: npm run version:check

      # Run the Node test suite.
      - name: Run npm tests
        run: npm test

      # Typecheck the frontend without emitting output.
      - name: Typecheck frontend
        run: npx tsc --noEmit

      # Full frontend build validation: check:ui + tsc + vite build.
      # Catches Vite, Tailwind v4 and check-card-motion breakages that
      # unit tests and tsc alone cannot detect.
      - name: Build frontend
        run: npm run build

      # Enforce ESLint recommended rules (incl. react-hooks) and Prettier
      # formatting so hooks bugs and style drift fail CI, not review.
      - name: Lint frontend
        run: npm run lint

      - name: Check formatting
        run: npm run format:check
