[package]
name = "ownhub-sessions"
version = "0.1.0"
description = "OwnHub session catalog: the unified listing, the eight harness adapters and the transcript readers"
authors = ["Operator"]
edition = "2021"
rust-version = "1.77.2"

[dependencies]
# Storage layout: the adapters only need atomic temp-file naming.
ownhub-core = { path = "../ownhub-core" }
# Wire types and harness transcripts are (de)serialized here; the desktop
# shell and the transcript readers share these shapes.
serde.workspace = true
serde_json.workspace = true
# Every harness keeps its chat history in SQLite; sessions are opened
# read-only so a running agent keeps its locks.
rusqlite.workspace = true

[dev-dependencies]
# Test fixtures share one scratch root (`ownhub_core::test_support`).
ownhub-core = { path = "../ownhub-core", features = ["test-support"] }
