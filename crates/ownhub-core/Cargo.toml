[package]
name = "ownhub-core"
version = "0.1.0"
description = "Foundational types for OwnHub: harness registry, storage paths and common errors"
authors = ["Operator"]
edition = "2021"
rust-version = "1.77.2"

[features]
# Compile `test_support` for the crates whose tests build fixtures under the
# same scratch root. Never enabled by a release build.
test-support = []

[dependencies]
serde.workspace = true

# `getuid` backs the per-uid fallback and the ownership check on the runtime
# scratch directory; both are Unix-only.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Projections on Windows are NTFS junctions: creating a symlink there needs
# `SeCreateSymbolicLinkPrivilege` or Developer Mode, a junction needs nothing.
# 1.x because the workspace's Rust floor is 1.77.2 (2.x requires 1.85).
[target.'cfg(windows)'.dependencies]
junction = "1"
