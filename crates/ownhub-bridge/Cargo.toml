[package]
name = "ownhub-bridge"
version = "0.1.0"
description = "OwnHub harness fusion: backups, projections, secondary-location cleanup and status"
authors = ["Operator"]
edition = "2021"
rust-version = "1.77.2"

[dependencies]
# Harness registry and storage layout the fusion reads.
ownhub-core = { path = "../ownhub-core" }
# JSONC rewriting of each harness's `skills.paths` list.
json5.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Test fixtures share one scratch root (`ownhub_core::test_support`).
ownhub-core = { path = "../ownhub-core", features = ["test-support"] }
