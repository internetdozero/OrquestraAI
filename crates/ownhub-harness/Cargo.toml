[package]
name = "ownhub-harness"
version = "0.1.0"
description = "Harness config adapters for OwnHub: one MCP server, one dialect per harness"
authors = ["Operator"]
edition = "2021"
rust-version = "1.77.2"

[dependencies]
# The harness registry (install paths, MCP envelope per harness) lives here.
ownhub-core = { path = "../ownhub-core" }
serde_json.workspace = true
json5.workspace = true
toml_edit.workspace = true

[dev-dependencies]
# Test fixtures share one scratch root (`ownhub_core::test_support`).
ownhub-core = { path = "../ownhub-core", features = ["test-support"] }
