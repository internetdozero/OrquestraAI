[package]
name = "orquestra-sessions"
version = "0.1.0"
description = "OrquestraAI session catalog: the unified listing, the nine harness adapters and the transcript readers"
authors = ["Operator"]
edition = "2021"
rust-version = "1.77.2"

[dependencies]
# Storage layout: the adapters only need atomic temp-file naming.
orquestra-core = { path = "../orquestra-core" }
# Wire types and harness transcripts are (de)serialized here; the desktop
# shell and the transcript readers share these shapes.
serde.workspace = true
serde_json.workspace = true
# Every harness keeps its chat history in SQLite; sessions are opened
# read-only so a running agent keeps its locks.
rusqlite.workspace = true
