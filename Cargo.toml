[workspace]
resolver = "2"
members = [
    "src-tauri",
]

# Fast rebuilds for our own crates (incremental), while dependencies stay at
# opt-level 1 so debug runs are usable on a small machine without paying for
# full codegen of Tauri/GTK/Serde.
[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
# 4 codegen units matches the 4 CPU threads (avoids thrashing the scheduler)
codegen-units = 4
# Turning LTO off saves ~60s of 100% CPU link-time churn and prevents thermal throttling
lto = "off"
opt-level = 2
panic = "abort"
strip = true
