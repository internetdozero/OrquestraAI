[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/orquestra-core",
    "crates/orquestra-harness",
    "crates/orquestra-vault",
    "crates/orquestra-bridge",
    "crates/orquestra-sessions",
]

# Shared dependency versions. Every member opts in with `dep.workspace = true`,
# so the whole workspace compiles one copy of each crate and a version bump
# happens exactly once.
[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# JSONC harness configs (Claude, Antigravity, OpenCode, Kilo, Copilot) accept
# comments and trailing commas, which plain JSON parsers reject.
json5 = "1.3"
# Format-preserving TOML editing: the Codex adapter rewrites
# `[mcp_servers.*]` blocks inside a hand-maintained config.toml, and losing
# its comments, key order or unrelated sections would be unacceptable.
toml_edit = "0.22"
# Every harness keeps its chat history in SQLite (and the idea vault keeps its
# own database). `bundled` ships the engine inside the binary so a release
# build never depends on a system libsqlite3; session stores are opened
# read-only so a running agent keeps its locks.
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10.3"
base64 = "0.23.1"
rand = "0.9.5"
# Bounded response streaming (`bytes_stream` + `StreamExt`); already a
# reqwest transitive dep, so this adds no new crates.
futures-util = { version = "0.3", default-features = false }
# Blind vault HTTP proxy: in-memory key injection via `vault_http_request`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Same major as the `url` already in Cargo.lock (reqwest's own dep), so the
# endpoint gate in `vault/endpoints.rs` parses with the identical WHATWG
# rules the sender applies — parser disagreement is the SSRF bypass class.
url = "2"
# One persistent backend per OS: Secret Service on Linux, Keychain on
# macOS, Credential Manager on Windows. `linux-native` (the kernel
# keyring) is deliberately NOT enabled: kernel keys vanish on reboot, so a
# fresh boot would generate a new file key and strand every sealed secret.
# `crypto-rust` keeps the D-Bus crypto pure-Rust (no OpenSSL system dep).
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
# `preserve_order` keeps the key order of the configs we edit, so a harness
# whose config is already correct is left byte-identical instead of being
# rewritten just to reorder its keys.
serde_json = { version = "1", features = ["preserve_order"] }

# Fast rebuilds and thermal preservation on dual-core hardware.
# Incremental is disabled so sccache can achieve high cache hit rates (sccache cannot
# cache incremental builds). Dependencies stay at opt-level 0 to eliminate LLVM churn.
[profile.dev]
incremental = false

[profile.dev.package."*"]
opt-level = 0

[profile.release]
# 4 codegen units matches the 4 CPU threads (avoids thrashing the scheduler)
codegen-units = 4
# Turning LTO off saves ~60s of 100% CPU link-time churn and prevents thermal throttling
lto = "off"
opt-level = 2
panic = "abort"
strip = true
